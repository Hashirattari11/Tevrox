<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review Queue - Tevrox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">T</div>
                    <span class="text-xl font-bold text-slate-900 font-serif tracking-tight">Tevrox</span>
                </a>
                <div class="flex items-center gap-8 px-8">
                    <a href="/products" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Products</a>
                    <a href="/dashboard" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Dashboard</a>
                    <a href="/admin/products" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Admin</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/login" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Log in</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-12 sm:px-8 lg:px-10">
        <h1 class="text-3xl font-bold text-slate-900 mb-6">Admin Review Queue</h1>
        <p class="text-slate-600 mb-8">Unverified products awaiting admin approval.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">📦</div>
                        <div>
                            <div class="text-sm font-semibold text-slate-900">Hydrating Serum</h3>
                            <div class="text-xs text-slate-500">Unverified</div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <span class="text-xs text-slate-400">Barcode: 123456789</span>
                    <button class="px-4 py-2 rounded-md bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition-all">Verify</button>
                    <button class="px-4 py-2 rounded-md bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition-all">Reject</button>
                </div>
            </div>
            <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">📦</div>
                        <div>
                            <div class="text-sm font-semibold text-slate-900">Moisturizer</h3>
                            <div class="text-xs text-slate-500">Unverified</div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <span class="text-xs text-slate-400">Barcode: 987654321</span>
                    <button class="px-4 py-2 rounded-md bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition-all">Verify</button>
                    <button class="px-4 py-2 rounded-md bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition-all">Reject</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
