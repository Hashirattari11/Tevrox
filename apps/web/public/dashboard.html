<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tevrox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">T</div>
                    <span class="text-xl font-bold text-slate-900 font-serif tracking-tight">Tevrox</span>
                </a>
                <div class="flex items-center gap-8 px-8">
                    <a href="/products" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Products</a>
                    <a href="/" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Dashboard</a>
                    <a href="/admin/products" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Admin</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/login" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors">Log in</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-24 sm:px-8 lg:px-10">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Dashboard</h1>
            <p class="text-sm text-slate-600">Welcome back</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="p-6 rounded-xl border border-slate-200 bg-white shadow-sm">
                <div class="text-sm font-medium text-slate-600">Products</div>
                <div class="text-2xl font-bold text-slate-900 mt-2">12</div>
            </div>
            <div class="p-6 rounded-xl border border-slate-200 bg-white shadow-sm">
                <div class="text-sm font-medium text-slate-600">Ingredients</div>
                <div class="text-2xl font-bold text-slate-900 mt-2">24</div>
            </div>
            <div class="p-6 rounded-xl border border-slate-200 bg-white shadow-sm">
                <div class="text-sm font-medium text-slate-600">Routines</div>
                <div class="text-2xl font-bold text-slate-900 mt-2">3</div>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-lg font-semibold text-slate-900 mb-4">Recent Activity</h2>
            <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                <div class="text-sm text-slate-600">No recent activity</div>
            </div>
        </div>
    </div>
</body>
</html>
